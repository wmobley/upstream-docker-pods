# docker-compose.yml

services:
  web:
    platform: linux/amd64
    build: .
    command: /upstream/scripts/run.sh --reload --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - 8000:8000
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fastapi_traefik:fastapi_traefik@db:5432/fastapi_traefik}
    depends_on:
      - db
  db:
    platform: linux/amd64
    image: postgis/postgis
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=fastapi_traefik
      - POSTGRES_PASSWORD=fastapi_traefik
      - POSTGRES_DB=fastapi_traefik

volumes:
  postgres_data:
