name: One-time production backend deployment

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Full backend image commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: Tapis Configure
    env:
      TAPIS_SERVICE_USERNAME: ${{ secrets.TAPIS_DEVELOP_USERNAME }}
      TAPIS_SERVICE_PASSWORD: ${{ secrets.TAPIS_DEVELOP_PASSWORD }}
      TAPIS_BASE_URL: https://portals.tapis.io
      TAPIS_POD_ID: upstreamapi

    steps:
      - name: Set up Python for Tapis auth
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Tapis token via tapipy
        id: tapis_token
        run: |
          pip install tapipy==1.8.5 --quiet
          TAPIS_TOKEN=$(python3 .github/scripts/get_tapis_token.py)
          if [ -z "$TAPIS_TOKEN" ]; then
            echo "ERROR: Failed to obtain Tapis token" && exit 1
          fi
          echo "::add-mask::$TAPIS_TOKEN"
          echo "token=$TAPIS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy image to production API Pod
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          TAPIS_TOKEN: ${{ steps.tapis_token.outputs.token }}
        run: |
          IMAGE="ghcr.io/wmobley/upstream-docker-pods:sha-${IMAGE_SHA:0:7}"

          POD=$(curl -sf "${TAPIS_BASE_URL}/v3/pods/${TAPIS_POD_ID}" \
            -H "X-Tapis-Token: ${TAPIS_TOKEN}" | jq '.result')

          STARTUP_CMD='["/bin/bash","-c","until alembic upgrade heads; do echo Waiting for DB...; sleep 10; done && uvicorn app.main:app --reload --host 0.0.0.0"]'

          PAYLOAD=$(echo "$POD" | jq --arg img "$IMAGE" --argjson cmd "$STARTUP_CMD" '{
            image: $img,
            description: .description,
            command: $cmd,
            arguments: .arguments,
            environment_variables: (.environment_variables // {}),
            secret_map: (.secret_map // {}),
            status_requested: "RESTART",
            volume_mounts: (.volume_mounts // {}),
            time_to_stop_default: (.time_to_stop_default // -1),
            time_to_stop_instance: .time_to_stop_instance,
            networking: (.networking // {}),
            resources: (.resources // {}),
            compute_queue: (.compute_queue // "default")
          }')

          STATUS=$(curl -sf -X PUT "${TAPIS_BASE_URL}/v3/pods/${TAPIS_POD_ID}" \
            -H "X-Tapis-Token: ${TAPIS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | jq -r '.status')
          echo "Tapis Pods update status: ${STATUS}"
