name: Build and Push Docker Image

on:
  push:
    branches: ['main', 'feature/**']
  pull_request:
    branches: ['main', 'feature/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cp .env.sample .env
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Check mypy
        run: |
          mypy .

  build-and-push:
    needs: pytest
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build-image.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=develop-${{ github.sha }}

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-develop:
    needs: build-and-push
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')) && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Tapis Configure
    env:
      TAPIS_SERVICE_USERNAME: ${{ secrets.TAPIS_DEVELOP_USERNAME }}
      TAPIS_SERVICE_PASSWORD: ${{ secrets.TAPIS_DEVELOP_PASSWORD }}
      TAPIS_BASE_URL: https://portals.tapis.io
      TAPIS_POD_ID: upstreamdevelopapi
      TAPIS_WORKER_ID: upstreamdevelopworker

    steps:
      - name: Set up Python for Tapis auth
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Tapis token via tapipy
        id: tapis_token
        run: |
          pip install tapipy==1.8.5 --quiet
          TAPIS_TOKEN=$(python3 .github/scripts/get_tapis_token.py)
          if [ -z "$TAPIS_TOKEN" ]; then
            echo "ERROR: Failed to obtain Tapis token" && exit 1
          fi
          echo "::add-mask::$TAPIS_TOKEN"
          echo "token=$TAPIS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Tapis Pods (develop)
        run: |
          set -euo pipefail
          if [[ "${TAPIS_BASE_URL}" != "https://portals.tapis.io" ]]; then
            echo "Refusing to update an unapproved Tapis control plane: ${TAPIS_BASE_URL}"
            exit 1
          fi
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:develop-${GITHUB_SHA}"
          TAPIS_TOKEN="${{ steps.tapis_token.outputs.token }}"

          request_json() {
            local method="$1"
            local path="$2"
            local request_body="${3-}"
            local response_file
            local status
            response_file=$(mktemp)

            if [[ -n "$request_body" ]]; then
              status=$(curl -sS -o "$response_file" -w "%{http_code}" -X "$method" \
                "${TAPIS_BASE_URL}${path}" \
                -H "X-Tapis-Token: ${TAPIS_TOKEN}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "$request_body")
            else
              status=$(curl -sS -o "$response_file" -w "%{http_code}" -X "$method" \
                "${TAPIS_BASE_URL}${path}" \
                -H "X-Tapis-Token: ${TAPIS_TOKEN}" \
                -H "Accept: application/json")
            fi

            if [[ "$status" == 2?? ]]; then
              cat "$response_file"
              rm -f "$response_file"
              return 0
            fi

            if [[ "$status" == "404" ]]; then
              rm -f "$response_file"
              return 4
            fi

            echo "Tapis ${method} ${path} failed with HTTP ${status}" >&2
            jq -c '{message: (.message // .error_message // .result // .)}' "$response_file" >&2 || true
            rm -f "$response_file"
            return 1
          }

          IMPORT_VOLUME_ID="upstreamdevelopimportvolume"
          IMPORT_STORAGE_PATH="/var/lib/upstream-bulk-imports"

          if import_volume="$(request_json GET "/v3/pods/volumes/${IMPORT_VOLUME_ID}")"; then
            echo "Using existing import volume ${IMPORT_VOLUME_ID}"
          else
            import_status=$?
            if [[ "$import_status" -ne 4 ]]; then
              exit "$import_status"
            fi
            echo "Creating missing import volume ${IMPORT_VOLUME_ID}"
            request_json POST "/v3/pods/volumes" "$(jq -n --arg id "$IMPORT_VOLUME_ID" '{volume_id: $id, description: "Durable async import chunks for upstream-develop"}')" >/dev/null
          fi

          api="$(request_json GET "/v3/pods/${TAPIS_POD_ID}" | jq '.result')"
          database_url="$(jq -r '.environment_variables.DATABASE_URL // empty' <<<"$api")"
          if [[ -z "$database_url" ]]; then
            echo "Existing API pod does not expose DATABASE_URL; cannot create the worker safely" >&2
            exit 1
          fi

          API_STARTUP_CMD='["/bin/bash","-c","until alembic upgrade heads; do echo Waiting for DB...; sleep 10; done && uvicorn app.main:app --host 0.0.0.0"]'
          WORKER_STARTUP_CMD='["/bin/bash","-c","python -m app.workers.process_upload_imports --poll-all"]'

          api_payload="$(jq --arg img "$IMAGE" --arg tapis "$TAPIS_BASE_URL" --arg volume "$IMPORT_VOLUME_ID" --arg path "$IMPORT_STORAGE_PATH" --argjson cmd "$API_STARTUP_CMD" '{
            image: $img,
            description: .description,
            command: $cmd,
            arguments: .arguments,
            environment_variables: ((.environment_variables // {}) + {
              "TAPIS_BASE_URL": $tapis,
              "BULK_INGESTION_ENABLED": "true",
              "ASYNC_BULK_INGESTION_ENABLED": "true",
              "BULK_IMPORT_STORAGE_PATH": $path,
              "BULK_IMPORT_STAGING_BATCH_SIZE": "100",
              "BULK_IMPORT_WORKER_POLL_SECONDS": "15"
            }),
            secret_map: (.secret_map // {}),
            status_requested: "RESTART",
            volume_mounts: ((.volume_mounts // {}) + {
              ($path): {type: "tapisvolume", source_id: $volume, sub_path: ""}
            }),
            time_to_stop_default: (.time_to_stop_default // -1),
            time_to_stop_instance: .time_to_stop_instance,
            networking: (.networking // {}),
            resources: (.resources // {}),
            compute_queue: (.compute_queue // "default")
          }' <<<"$api")"
          echo "$api_payload" | jq -e --arg expected "$IMAGE" '.image == $expected and .volume_mounts["/var/lib/upstream-bulk-imports"].source_id == "upstreamdevelopimportvolume"' >/dev/null
          request_json PUT "/v3/pods/${TAPIS_POD_ID}" "$api_payload" | jq -r '.status // .result.status // "updated"' | sed "s/^/${TAPIS_POD_ID}: /"

          if worker="$(request_json GET "/v3/pods/${TAPIS_WORKER_ID}")"; then
            worker_payload="$(jq --arg img "$IMAGE" --arg db "$database_url" --arg stack "$(jq -r '.stack_id // "upstreamdevelop"' <<<"$api")" --arg volume "$IMPORT_VOLUME_ID" --arg path "$IMPORT_STORAGE_PATH" --argjson cmd "$WORKER_STARTUP_CMD" --argjson existing "$(jq '.result' <<<"$worker")" '{
              image: $img,
              description: ($existing.description // "Upstream async import worker"),
              command: $cmd,
              arguments: ($existing.arguments // []),
              environment_variables: {
                "DATABASE_URL": $db,
                "ENVIRONMENT": "develop",
                "ENV": "develop",
                "BULK_INGESTION_ENABLED": "true",
                "ASYNC_BULK_INGESTION_ENABLED": "true",
                "BULK_IMPORT_STORAGE_PATH": $path,
                "BULK_IMPORT_STAGING_BATCH_SIZE": "100",
                "BULK_IMPORT_WORKER_POLL_SECONDS": "15",
                "BULK_IMPORT_WORKER_LEASE_SECONDS": "1800",
                "BULK_IMPORT_MAX_ATTEMPTS": "3"
              },
              secret_map: {},
              status_requested: "ON",
              volume_mounts: {($path): {type: "tapisvolume", source_id: $volume, sub_path: ""}},
              time_to_stop_default: ($existing.time_to_stop_default // -1),
              time_to_stop_instance: $existing.time_to_stop_instance,
              networking: ($existing.networking // {
                default: {
                  protocol: "local_only",
                  port: 8000,
                  url: "upstreamdevelopworker.pods.portals.tapis.io"
                }
              }),
              resources: ($existing.resources // {cpu_request: 250, cpu_limit: 2000, mem_request: 256, mem_limit: 3072, gpus: 0}),
              compute_queue: ($existing.compute_queue // "default")
            }' <<<"$worker")"
            request_json PUT "/v3/pods/${TAPIS_WORKER_ID}" "$worker_payload" | jq -r '.status // .result.status // "updated"' | sed "s/^/${TAPIS_WORKER_ID}: /"
          else
            worker_status=$?
            if [[ "$worker_status" -ne 4 ]]; then
              exit "$worker_status"
            fi
            echo "Creating missing worker ${TAPIS_WORKER_ID}"
            worker_payload="$(jq -n --arg img "$IMAGE" --arg db "$database_url" --arg stack "$(jq -r '.stack_id // "upstreamdevelop"' <<<"$api")" --arg volume "$IMPORT_VOLUME_ID" --arg path "$IMPORT_STORAGE_PATH" --argjson cmd "$WORKER_STARTUP_CMD" '{
              pod_id: "upstreamdevelopworker",
              image: $img,
              description: "Upstream async import worker",
              stack_id: $stack,
              command: $cmd,
              environment_variables: {
                "DATABASE_URL": $db,
                "ENVIRONMENT": "develop",
                "ENV": "develop",
                "BULK_INGESTION_ENABLED": "true",
                "ASYNC_BULK_INGESTION_ENABLED": "true",
                "BULK_IMPORT_STORAGE_PATH": $path,
                "BULK_IMPORT_STAGING_BATCH_SIZE": "100",
                "BULK_IMPORT_WORKER_POLL_SECONDS": "15",
                "BULK_IMPORT_WORKER_LEASE_SECONDS": "1800",
                "BULK_IMPORT_MAX_ATTEMPTS": "3"
              },
              status_requested: "ON",
              volume_mounts: {($path): {type: "tapisvolume", source_id: $volume, sub_path: ""}},
              time_to_stop_default: -1,
              networking: {
                default: {
                  protocol: "local_only",
                  port: 8000,
                  url: "upstreamdevelopworker.pods.portals.tapis.io"
                }
              },
              resources: {cpu_request: 250, cpu_limit: 2000, mem_request: 256, mem_limit: 3072, gpus: 0}
            }')"
            request_json POST "/v3/pods" "$worker_payload" | jq -r '.status // .result.status // "created"' | sed "s/^/${TAPIS_WORKER_ID}: /"
          fi
