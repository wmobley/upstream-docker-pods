name: Build and Push Docker Image

on:
  push:
    branches: ['main', 'feature/**']
  pull_request:
    branches: ['main', 'feature/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cp .env.sample .env
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Check mypy
        run: |
          mypy .

  build-and-push:
    needs: pytest
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build-image.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-develop:
    needs: build-and-push
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')) && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Tapis Configure
    env:
      TAPIS_SERVICE_USERNAME: ${{ secrets.TAPIS_DEVELOP_USERNAME }}
      TAPIS_SERVICE_PASSWORD: ${{ secrets.TAPIS_DEVELOP_PASSWORD }}
      TAPIS_BASE_URL: https://portals.tapis.io
      TAPIS_POD_ID: upstreamdevelopapi
      TAPIS_WORKER_ID: upstreamdevelopworker

    steps:
      - name: Set up Python for Tapis auth
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Tapis token via tapipy
        id: tapis_token
        run: |
          pip install tapipy==1.8.5 --quiet
          TAPIS_TOKEN=$(python3 .github/scripts/get_tapis_token.py)
          if [ -z "$TAPIS_TOKEN" ]; then
            echo "ERROR: Failed to obtain Tapis token" && exit 1
          fi
          echo "::add-mask::$TAPIS_TOKEN"
          echo "token=$TAPIS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Tapis Pods (develop)
        run: |
          set -euo pipefail
          DIGEST="${{ needs.build-and-push.outputs.image-digest }}"
          if [[ "${TAPIS_BASE_URL}" != "https://portals.tapis.io" ]]; then
            echo "Refusing to update an unapproved Tapis control plane: ${TAPIS_BASE_URL}"
            exit 1
          fi
          if [[ "${DIGEST}" != sha256:* ]]; then
            echo "Build did not produce an immutable image digest"
            exit 1
          fi
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}@${DIGEST}"
          TAPIS_TOKEN="${{ steps.tapis_token.outputs.token }}"

          update_pod() {
            local pod_id="$1"
            local startup_cmd="$2"
            local is_worker="$3"
            local pod
            local payload
            pod=$(curl -sf "${TAPIS_BASE_URL}/v3/pods/${pod_id}" \
              -H "X-Tapis-Token: ${TAPIS_TOKEN}" | jq '.result')
            payload=$(echo "$pod" | jq --arg img "$IMAGE" --arg tapis "$TAPIS_BASE_URL" --argjson cmd "$startup_cmd" --argjson is_worker "$is_worker" '{
              image: $img,
              description: .description,
              command: $cmd,
              arguments: .arguments,
              environment_variables: ((.environment_variables // {}) + {
                "TAPIS_BASE_URL": $tapis,
                "BULK_INGESTION_ENABLED": "false",
                "ASYNC_BULK_INGESTION_ENABLED": "false",
                "BULK_IMPORT_STORAGE_PATH": "/var/lib/upstream-bulk-imports",
                "BULK_IMPORT_WORKER_POLL_SECONDS": "15"
              }),
              secret_map: (.secret_map // {}),
              status_requested: "RESTART",
              volume_mounts: (.volume_mounts // {}),
              time_to_stop_default: (.time_to_stop_default // -1),
              time_to_stop_instance: .time_to_stop_instance,
              networking: (.networking // {}),
              resources: (.resources // {}),
              compute_queue: (.compute_queue // "default")
            } | if $is_worker then .environment_variables |= del(.TAS_USER, .TAS_SECRET, .JWT_SECRET, .TAS_URL, .TAPIS_BASE_URL, .CKAN_URL, .CKAN_ADMIN_API_KEY) else . end')
            echo "$payload" | jq -e --arg expected "$IMAGE" '.image == $expected' >/dev/null
            curl -sf -X PUT "${TAPIS_BASE_URL}/v3/pods/${pod_id}" \
              -H "X-Tapis-Token: ${TAPIS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" | jq -r ".status | \"${pod_id}: \" + tostring"
          }

          API_STARTUP_CMD='["/bin/bash","-c","until alembic upgrade heads; do echo Waiting for DB...; sleep 10; done && uvicorn app.main:app --host 0.0.0.0"]'
          WORKER_STARTUP_CMD='["/bin/bash","-c","python -m app.workers.process_upload_imports --poll"]'
          update_pod "${TAPIS_POD_ID}" "$API_STARTUP_CMD" false
          update_pod "${TAPIS_WORKER_ID}" "$WORKER_STARTUP_CMD" true
